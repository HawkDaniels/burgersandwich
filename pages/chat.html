<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000080">
<meta name="color-scheme" content="light">
<title>Chat</title>
<!-- The chat itself (and its look) is in /chat/chat-client.js, shared with BurgerOS's BS Messenger.
     This page only makes it fill the window. The homepages embed this page in an iframe. -->
<style>
  *, *::before, *::after { box-sizing: border-box; }
  :root { --app-h: 100vh; --app-top: 0px; }
  @supports (height: 100dvh) { :root { --app-h: 100dvh; } }

  html {
    height: 100%;
    -webkit-text-size-adjust: 100%; text-size-adjust: 100%;
    -webkit-tap-highlight-color: transparent;
  }
  body {
    /* Pinned to the visible area. On a phone the chat keeps --app-h / --app-top
       in step with the on-screen keyboard (fitViewport). */
    position: fixed; left: 0; right: 0;
    top: var(--app-top); height: var(--app-h);
    margin: 0;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    display: flex; flex-direction: column; overflow: hidden;
    overscroll-behavior: none; touch-action: manipulation;
    background: #c0c0c0; color: #000;
    font: 12px Tahoma, Verdana, sans-serif;
  }
  body.kb { padding-bottom: 0; } /* keyboard open: no home-indicator gap */
</style>
</head>
<body>
<script src="/chat/chat-client.js"></script>
<script>
  BSChat.mount(document.body, { look: "page", title: "burgersandwich messenger", fitViewport: true });
</script>
</body>
</html>
