<span id="rate" style="position: fixed; top: 5px; right: 10px; font-weight: bold; font-size: 24px;">...</span>

<script>
fetch("https://open.er-api.com/v6/latest/USD")
  .then(function (r) { return r.json(); })
  .then(function (d) {
    var vnd = Math.round(d.rates.VND).toLocaleString();
    document.getElementById("rate").textContent = "1 USD = " + vnd + " VND";
  })
  .catch(function () {
    document.getElementById("rate").textContent = "rate unavailable";
  });
</script>
