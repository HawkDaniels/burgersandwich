<script>
(function () {
  // Address of the click-counter Worker's /downloads route.
  // Replace CLICK-COUNTER-ADDRESS with the same domain your other counter's fetch uses.
  const API = 'https://click-counter.oksohi.workers.dev/downloads';

  function getFileSize(href) {
    return fetch(href, { method: 'HEAD', cache: 'no-store' })
      .then(function (r) {
        const len = Number(r.headers.get('Content-Length'));
        if (len) return len;
        return fetch(href, { headers: { Range: 'bytes=0-0' }, cache: 'no-store' })
          .then(function (r2) {
            const range = r2.headers.get('Content-Range'); // e.g. "bytes 0-0/442368"
            if (r2.body) r2.body.cancel(); // don't download the rest
            const match = range && range.match(/\/(\d+)$/);
            return match ? Number(match[1]) : null;
          });
      });
  }

  const links = document.querySelectorAll('a[data-download-id]');
  const state = {}; // id -> { size, count, el }

  function render(id) {
    const s = state[id];
    const size = s.size != null ? '(' + s.size + ' MB)' : '';
    const count = s.count != null ? s.count : '…';
    s.el.textContent = size + ' Downloads: ' + count;
  }

  links.forEach(function (link) {
    const id = link.dataset.downloadId;
    state[id] = { size: null, count: null, el: link.nextElementSibling };
    render(id);

    // File size. Order of attempts:
    //   1. data-size="1.23" on the link (in MB), if you set one by hand
    //   2. Content-Length from a HEAD request
    //   3. Content-Range from a request for just the first byte
    //      (used when the server leaves out Content-Length, as Cloudflare can)
    if (link.dataset.size) {
      state[id].size = Number(link.dataset.size).toFixed(2);
      render(id);
    } else {
      getFileSize(link.href)
        .then(function (bytes) {
          if (bytes) {
            state[id].size = (bytes / 1048576).toFixed(2);
            render(id);
          }
        })
        .catch(function () {});
    }

    // Count the download. Uses fetch rather than sendBeacon, which ad blockers
    // such as uBlock Origin block. keepalive lets it finish as the download starts.
    // Only the first click per item counts until the page is refreshed.
    link.addEventListener('click', function () {
      if (state[id].counted) return;
      state[id].counted = true;
      fetch(API, {
        method: 'POST',
        body: JSON.stringify({ id: id }),
        keepalive: true
      }).catch(function () {});
      if (state[id].count != null) {
        state[id].count += 1;
        render(id);
      }
    });
  });

  // Load all counts in one request
  fetch(API, { cache: 'no-store' })
    .then(function (r) { return r.json(); })
    .then(function (counts) {
      Object.keys(state).forEach(function (id) {
        state[id].count = counts[id] || 0;
        render(id);
      });
    })
    .catch(function () {});
})();
</script>
