<script>
(function () {
  // Download counts are kept by bs-backend at /api/downloads on this same site.
  const API = '/api/downloads';

  const links = document.querySelectorAll('a[data-download-id]');
  const state = {}; // id -> { size, count, el }

  function render(id) {
    const s = state[id];
    const size = s.size != null ? '(' + s.size + ' MB)' : '';
    const count = s.count != null ? s.count : '…';
    s.el.textContent = size + ' Downloads: ' + count;
  }

  links.forEach(function (link) {
    const id = link.dataset.downloadId;
    state[id] = { size: null, count: null, el: link.nextElementSibling };
    render(id);

    // File size comes from data-size="1.23" on the link (in MB). Set it when adding a file:
    // size in bytes / 1048576, rounded to two places. A link without it just shows no size.
    if (link.dataset.size) {
      state[id].size = Number(link.dataset.size).toFixed(2);
      render(id);
    }

    // Count the download. Uses fetch rather than sendBeacon, which ad blockers
    // such as uBlock Origin block. keepalive lets it finish as the download starts.
    // Only the first click per item counts until the page is refreshed.
    link.addEventListener('click', function () {
      if (state[id].counted) return;
      state[id].counted = true;
      fetch(API, {
        method: 'POST',
        body: JSON.stringify({ id: id }),
        keepalive: true
      }).catch(function () {});
      if (state[id].count != null) {
        state[id].count += 1;
        render(id);
      }
    });
  });

  // Load all counts in one request
  fetch(API, { cache: 'no-store' })
    .then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    })
    .then(function (counts) {
      Object.keys(state).forEach(function (id) {
        state[id].count = counts[id] || 0;
        render(id);
      });
    })
    .catch(function () {});
})();
</script>
