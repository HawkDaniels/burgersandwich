<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BurgerOS 98</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="stylesheet" href="burgeros/os.css">
</head>
<body>
<!-- Everything visitors see is set in burgeros/content.js -->
<div id="desktop"></div>
<div id="startMenu" class="raised">
  <div id="startBanner"><span></span></div>
  <ul class="menu big" id="startList"></ul>
</div>
<div id="taskbar" class="raised">
  <button id="startBtn" class="raised"></button>
  <div id="tasks"></div>
  <div id="tray"><span id="trayIcons"></span><span id="clock"></span></div>
</div>
<div id="balloon"></div>
<div id="shutdown">It's now safe to turn off<br>your computer.</div>

<script src="burgeros/content.js"></script>
<script src="burgeros/core.js"></script>
</body>
</html>
